name: Asistente proactivo

# El disparo automático (schedule) se retiró: GitHub llegó a retrasarlo hasta
# casi 4 horas en la práctica (verificado con los timestamps reales de las
# ejecuciones), porque el cron de Actions es "a mejor esfuerzo" y no da
# garantía de horario en repos de uso bajo. El horario real ahora lo maneja
# un Schedule Job de Dokploy, que corre en el propio servidor sin depender de
# la cola compartida de GitHub. Este workflow se deja solo para poder
# disparar el aviso a mano si alguna vez hace falta probar algo puntual.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probar sin enviar el mensaje'
        type: boolean
        default: true

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar al asistente
        run: |
          URL="${{ secrets.APP_BASE_URL }}/api/cron/checkin"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            URL="$URL?dry_run=1"
          fi
          echo "Llamando a $URL"
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$URL" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          # Un fallo del servidor no debe pasar desapercibido.
          if [ "$code" != "200" ]; then exit 1; fi
